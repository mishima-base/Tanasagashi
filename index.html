<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棚さがし|三島BASE カルテ運用</title>
<style>
:root{
  --navy:#1f3252; --navy2:#2a4068; --paper:#f7f5f0; --card:#fffdf9; --line:#ddd7ca;
  --ink:#1f2937; --muted:#5b6472; --accent:#b4471a; --accent-soft:#fbeee4; --tray:#e3dfd5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;line-height:1.6}
header{background:var(--navy);color:var(--paper);padding:20px 24px}
header .wrap{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
header h1{font-size:24px;margin:0;font-weight:700}
header p{margin:0;color:#c9d2e0;font-size:14px}
main{max-width:880px;margin:0 auto;padding:28px 20px 60px}
.search{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
.search label{display:block;font-weight:700;color:var(--navy);margin-bottom:10px;font-size:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}
#zip{flex:1;min-width:220px;font-size:40px;letter-spacing:.08em;padding:10px 18px;border:2px solid var(--navy);border-radius:10px;font-family:inherit;color:var(--navy);background:#fff}
#zip:focus{outline:3px solid #f0a36b;outline-offset:2px}
button{font-family:inherit;cursor:pointer}
#clear{font-size:16px;padding:0 20px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--muted)}
#clear:focus-visible,.area-btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:3px solid #f0a36b;outline-offset:2px}
.hint{margin:10px 0 0;color:var(--muted);font-size:14px}
#result{margin-top:24px}
.tray{background:var(--tray);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;border-bottom:6px solid #c9c3b5}
.tray .zipline{color:var(--muted);font-size:15px}
.label{background:#fff;border:1px solid #cfc8b8;border-radius:6px;padding:12px 40px;font-size:48px;font-weight:700;color:var(--navy);text-align:center;line-height:1.3}
.tray .unit{font-size:15px;color:var(--ink)}
.tray .unit b{color:var(--navy)}
.multi{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.multi .label{font-size:34px;padding:10px 28px}
.note{background:var(--accent-soft);border-left:6px solid var(--accent);border-radius:8px;padding:14px 18px;margin-top:16px}
.note h2{margin:0 0 6px;font-size:17px;color:var(--accent)}
.note p{margin:0;font-size:15px}
.cand{margin-top:14px;display:grid;gap:10px}
.cand-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cand-item .name{font-size:20px;font-weight:700;color:var(--navy)}
.cand-item .sub{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:15px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px}
section.browse{margin-top:40px}
section.browse h2{font-size:18px;color:var(--navy);margin:0 0 4px}
section.browse > p{margin:0 0 16px;color:var(--muted);font-size:14px}
.group{margin-bottom:14px}
.group h3{font-size:14px;color:var(--muted);margin:0 0 6px;font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.area-btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:16px;color:var(--ink)}
.area-btn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
#zips{margin-top:18px}
.zips-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.zips-head b{font-size:20px;color:var(--navy)}
.zips-head span{color:var(--muted);font-size:14px}
.pref{margin-bottom:10px}
.pref h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
.chip small{color:var(--muted);margin-left:4px}
footer{max-width:880px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px}
@media (max-width:560px){#zip{font-size:30px}.label{font-size:36px;padding:10px 24px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>棚さがし</h1><p>郵便番号から、カルテを入れるストックの棚がわかります</p></div></header>
<main>
<div class="search">
<label for="zip">郵便番号</label>
<div class="row">
<input id="zip" inputmode="numeric" autocomplete="off" placeholder="411-0045" maxlength="9" aria-describedby="hint">
<button id="clear" type="button">クリア</button>
</div>
<p class="hint" id="hint">数字だけで入力できます(ハイフンは自動で入ります)。7桁で棚が表示され、途中まで入れると候補が出ます。</p>
</div>
<div id="result" aria-live="polite"></div>

<section class="browse">
<h2>棚から郵便番号を見る</h2>
<p>ラウンドの計画などで、その棚にどの郵便番号が入っているかを確認できます。</p>
<div id="areas"></div>
<div id="zips"></div>
</section>
</main>
<footer>一覧にない郵便番号は、近い郵便番号の棚を参考に担当者へ確認してください。社外秘。</footer>

const UNITS = [
 {g:"三島市", a:["三島南","三島北","三島東","三島西"]},
 {g:"沼津市", a:["沼津 西","沼津 南","沼津 東"]},
 {g:"伊豆", a:["伊豆中","伊豆北","伊豆南"]},
 {g:"函南町", a:["函南町 西部","函南町 東部"]},
 {g:"清水町・長泉町・裾野市", a:["清水町","長泉町","裾野市"]},
 {g:"その他の市町(1台にまとめて運用)", a:["御殿場市","熱海市","伊東市","富士市","小山町","その他"], combined:true}
];
const COMBINED = new Set(UNITS.find(u=>u.combined).a);
const zipEl = document.getElementById('zip');
const resEl = document.getElementById('result');
const fmt = z => z.slice(0,3)+'-'+z.slice(3);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(v){
  return v.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\D/g,'').slice(0,7);
}
function unitText(area){
  return COMBINED.has(area) ? '「その他の市町」の台に入れます(6地域を1台にまとめて運用)' : '「'+area+'」の台に入れます';
}
function summarize(prefix){
  const by = {};
  for (const z in MAP){ if(!z.startsWith(prefix)) continue;
    for (const a of MAP[z]){ (by[a] ||= {zips:[]}); by[a].zips.push(z); } }
  return Object.entries(by).sort((x,y)=>y[1].zips.length-x[1].zips.length);
}
function candHTML(list){
  return '<div class="cand">'+list.slice(0,8).map(([a,v])=>{
    const ex = v.zips.slice(0,4).map(fmt).join('、')+(v.zips.length>4?' ほか':'');
    return `<div class="cand-item"><div><div class="name">${esc(a)}</div><div class="sub">${esc(ex)}</div></div></div>`;
  }).join('')+'</div>';
}
function render(){
  const z = norm(zipEl.value);
  if (!z){ resEl.innerHTML=''; return; }
  if (z.length < 7){
    if (z.length < 3){ resEl.innerHTML='<p class="empty">あと'+(7-z.length)+'桁入力してください。</p>'; return; }
    const list = summarize(z);
    resEl.innerHTML = list.length
      ? `<p class="hint">「${esc(z.length>3?fmt(z):z)}」で始まる郵便番号の棚</p>`+candHTML(list)
      : '<p class="empty">「'+esc(z)+'」で始まる郵便番号は一覧にありません。入力を確認してください。</p>';
    return;
  }
  const hit = MAP[z];
  if (hit){
    const areas = hit;
    const labels = areas.length===1
      ? `<div class="label">${esc(areas[0])}</div><div class="unit">${esc(unitText(areas[0]))}</div>`
      : `<div class="multi">${areas.map(a=>`<div class="label">${esc(a)}</div>`).join('')}</div><div class="unit">この郵便番号は<b>複数の棚</b>にまたがっています。住所を確認してください。</div>`;
    resEl.innerHTML = `<div class="tray"><div class="zipline">〒${fmt(z)}</div>${labels}</div>`;
    return;
  }
  let list=[], used='';
  for (const len of [6,5,4,3]){ list = summarize(z.slice(0,len)); if (list.length){ used = z.slice(0,len); break; } }
  resEl.innerHTML = `<div class="note"><h2>〒${fmt(z)} は一覧にありません</h2><p>新しい地域の会員様の可能性があります。下の近い郵便番号の棚を参考に、住所を見て棚を決めてください。</p></div>`
    + (list.length ? `<p class="hint">「${esc(used.length>3?fmt(used):used)}」で始まる郵便番号の棚</p>`+candHTML(list)
                   : '<p class="empty">近い郵便番号も一覧にありません。「その他」の棚を検討してください。</p>');
}
zipEl.addEventListener('input', ()=>{ const z=norm(zipEl.value); const v = z.length>3 ? fmt(z) : z; if (zipEl.value!==v) zipEl.value=v; render(); });
document.getElementById('clear').addEventListener('click', ()=>{ zipEl.value=''; render(); zipEl.focus(); });

// browse
const areaZips = {};
for (const z in MAP) for (const a of MAP[z]) (areaZips[a] ||= []).push(z);
const areasEl = document.getElementById('areas'), zipsEl = document.getElementById('zips');
areasEl.innerHTML = UNITS.map(u=>`<div class="group"><h3>${esc(u.g)}</h3><div class="btns">${u.a.map(a=>`<button type="button" class="area-btn" aria-pressed="false" data-a="${esc(a)}">${esc(a)}</button>`).join('')}</div></div>`).join('');
areasEl.addEventListener('click', e=>{
  const b = e.target.closest('.area-btn'); if(!b) return;
  areasEl.querySelectorAll('.area-btn').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
  const a = b.dataset.a, list = (areaZips[a]||[]).sort();
  const groups = {};
  for (const z of list) (groups[z.slice(0,5)] ||= []).push(z);
  zipsEl.innerHTML = `<div class="zips-head"><b>${esc(a)}</b><span>郵便番号 ${list.length}件${COMBINED.has(a)?'(その他の市町の台)':''}</span></div>`
    + Object.entries(groups).map(([p,zs])=>`<div class="pref"><h4>${fmt(p+'00').slice(0,6)}**</h4><div class="chips">${zs.map(z=>`<button type="button" class="chip" data-z="${z}">${fmt(z)}</button>`).join('')}</div></div>`).join('');
});
zipsEl.addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  zipEl.value = fmt(c.dataset.z); render(); window.scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
});
</script>
